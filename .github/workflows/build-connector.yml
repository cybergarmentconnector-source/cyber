name: Build connector
on:
  push:
    paths: ["connector/**", ".github/workflows/build-connector.yml"]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.11" }
      - name: Build
        shell: pwsh
        run: |
          python -m pip install -r connector/requirements.txt pyinstaller
          python connector/connector.py selftest
          python -m PyInstaller --onefile --name TallyCloudConnector --clean connector/connector.py
      - name: Publish release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release delete connector-latest --yes --cleanup-tag 2>$null
          gh release create connector-latest dist/TallyCloudConnector.exe --title "Tally Cloud Connector" --notes "Download TallyCloudConnector.exe and double-click it on the PC that has Tally." --target ${{ github.sha }}
          exit 0
